name = DeathRewind
displayName = 死亡回溯
description = [v1.0.12] 死亡时在 YOU DIED 界面获得一次回溯机会，回到约 60 秒前的自己（位置、朝向、血量还原，世界/物品不回滚）。结算界面时间轴提供 60/50/40/30 秒四个节点（节点只标秒数，默认选 60 秒）；进图不足 60 秒则回到进图位置。HUD 1up 硬币提示剩余机会，进入关卡拿到机会时响一次「1UP」提示音。新增：游戏内按 Ctrl+I 打开设置面板，可调「每关 1UP 上限（1~3）」与「复活冷却（30/60/90 秒）」，面板显示当前得分、1UP 存量（用掉的画删除线）与冷却倒计时；击杀 BOSS 50 分、普通生物 5 分，累计 100 分额外 +1UP（带音效），复活用掉后进入冷却。在神秘山洞、仓库区地道等独立空间内也能回溯，并可跨空间回到主地图的老位置（换地图则清空重来）。萌新做的第一款 mod（AI 开发）如遇 bug 欢迎留言。
version = 1.0.12
tags =  体验优化,UI,Mod
