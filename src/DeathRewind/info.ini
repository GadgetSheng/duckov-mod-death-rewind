name=DeathRewind
displayName=死亡回溯
description="死亡时在结算界面获得一次回溯机会，回到约 60 秒前的自己：位置、朝向、血量全部还原（世界与物品不回滚）。\n进图不足 60 秒死亡则回到进图时的位置。\n\n特性：\n· 每关一次复活回溯机会（YOU DIED 界面一键操作）\n· 回溯按钮旁附锚点时刻画面预览\n· 进图不足 60 秒 → 回到进图位置\n· 地道/楼层内暂不支持回溯\n· 游戏内 Mod 设置界面可调参数（锚点间隔/回溯年龄等）\n\n萌新做的第一款mod！由于不熟练所以可能会导致有些意想不到的bug什么的（）如果遇到了欢迎在留言"
