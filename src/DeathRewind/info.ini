name = DeathRewind
displayName = 死亡回溯
description = 死亡时在结算界面获得一次回溯机会，回到约 60 秒前的自己：位置、朝向、血量全部还原（世界与物品不回滚）。进图不足 60 秒死亡则回到进图时的位置。特性：每关一次复活回溯机会（YOU DIED 界面一键操作）；HUD 状态栏 1up 硬币提示剩余机会；结算界面回溯时间轴可在 1~4 个回溯点间选择（约覆盖 60 秒），每个节点显示当时的画面。地道/楼层内暂不支持回溯。萌新做的第一款 mod（AI 开发）如遇 bug 欢迎在留言。――― 更新日志 ――― [v1.0.5] 2026-10-23：修复 Boss（零号区·矮鸭等）可能永久消失的问题——Mod 不再销毁游戏自己停用的敌人（玩家走远 100m 时游戏会暂时关闭敌人），完整回退也不再删除 Boss。 [v1.0.4] 2026-10-23：修复 Harmony 版本兼容 / 楼层切换锚点丢失 / 复活后头顶血条空 / 撤离点计时器不启动 / 基地误显示 1UP；新增复活血量下限 50%。 [v1.0.3] 2026-10-23：结算界面回溯时间轴。 [v1.0.2] 2026-10-21：回溯按钮布局调整、血量下限。 [v1.0.1] 2026-10-21：Harmony 兼容、1up HUD、锚点预览。
