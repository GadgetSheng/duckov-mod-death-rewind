name = DeathRewind
displayName = 死亡回溯
description = [v1.1.1]\n死亡时在 YOU DIED 界面获得一次回溯机会，回到约 60 秒前（时间轴 60/50/40/30 秒，默认 60 秒；进图不足 60 秒则回到进图位置）。\nCtrl+N 打开设置面板：开启增强模式后，用掉回溯机会时玩家击杀计分（BOSS 55 / 风暴 25 / 雇佣兵·游荡者 15 / 其他 5，精英★额外 +5），满 100 分 +1UP（不限次数、带音效），重新获得后进入复活冷却（0/30/60/90 秒）。\nHUD 1UP 硬币显示剩余机会 / 冷却倒计时 / 当前积分，进入关卡获得机会时响一次提示音。
version = 1.1.1
