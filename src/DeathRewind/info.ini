name=DeathRewind
displayName=死亡回溯
description="死亡时在结算界面获得一次回溯机会，回到约 60 秒前的自己：位置、朝向、血量全部还原（世界与物品不回滚）。\n进图不足 60 秒死亡则回到进图时的位置。\n\n特性：\n· 每关一次复活回溯机会（YOU DIED 界面一键操作）\n· 回溯按钮旁附锚点时刻画面预览\n· 结算界面新增回溯时间轴：可拖动在 1~4 个回溯点之间选择（约覆盖 60 秒），每个节点显示当时的画面\n· 进图不足 60 秒 → 回到进图位置\n· 地道/楼层内暂不支持回溯\n\n萌新做的第一款mod！（AI开发）由于不熟练所以可能会导致有些意想不到的bug什么的（）如果遇到了欢迎在留言\n\n――― 更新日志 ―――\n[v1.0.4] 2026-10-23\n· 修复：Harmony 版本兼容（同装 SuperPet 等内嵌旧版 Harmony 的 Mod 时回溯功能失效）\n· 修复：楼层/地道切换后回溯锚点丢失、死亡无回溯按钮（JLab 1→Main→2 重入时 HandleLevelInitialized 误清 _subScenes）\n· 修复：复活后头顶血条为空条（HealthBar.DeathTask 把条目移入对象池，补发 OnHealthChange 无目标）\n· 修复：复活后撤离点计时器不启动（DamageReceiver GO layer 被篡改为 DamageReceiver，CountDownArea layerMask 不认）\n· 修复：基地里误显示 1UP、误采集锚点、误弹出死亡裁决\n· 新增：回溯复活血量下限 50%（残血时刻回溯不再落地秒死）\n[v1.0.3] 2026-10-23\n· 新增：YOU DIED 结算界面新增回溯时间轴，可拖动在 1~4 个回溯点间选择（约覆盖 60 秒），每个节点显示当时的画面，回溯按钮上的秒数同步更新\n· 修复：重复进入同一房间（地道/独立房间/Boss 房）时沿用旧锚点，可能把玩家回溯到上一次访问的位置\n[v1.0.2] 2026-10-21\n· 调整：回溯按钮移至「继续」按钮正下方，不再挤占同一行\n· 调整：锚点预览图移至屏幕左侧垂直居中并放大\n· 新增：回溯复活血量下限 50%，残血时刻回溯不再落地秒死\n[v1.0.1] 2026-10-21\n· 修复：与内嵌旧版 Harmony 的 Mod（如超级宠物）同装时，回溯功能完全失效\n· 修复：复活后血条与实际血量不同步\n· 新增：HUD 状态栏「1up」硬币提示本关回溯机会，使用后消失\n· 调整：YOU DIED 界面锚点预览图移至窗口左下角"
