name = DeathRewind
displayName = 死亡回溯
description = [v1.0.10] 死亡时在 YOU DIED 界面获得一次回溯机会，回到约 60 秒前的自己（位置、朝向、血量还原，世界/物品不回滚）。结算界面时间轴提供 60/50/40/30 秒四个节点（节点只标秒数，默认选 60 秒）；进图不足 60 秒则回到进图位置。每关一次，HUD 1up 硬币提示剩余机会。在神秘山洞、仓库区地道等独立空间内也能回溯，并可跨空间回到主地图的老位置（换地图则清空重来）。萌新做的第一款 mod（AI 开发）如遇 bug 欢迎留言。
version = 1.0.10
tags =  体验优化,UI,Mod
