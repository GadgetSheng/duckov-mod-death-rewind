name = DeathRewind
displayName = 死亡回溯
description = [v1.1.0] 游戏内按 Ctrl+N 打开设置面板：可开启「增强模式」（默认关闭）并调「复活冷却（0/30/60/90 秒，0 = 无冷却）」，面板显示得分进度条与积分规则；增强模式开启后，死亡用掉回溯机会才开始计分：玩家击杀 BOSS 55 分、风暴生物 25 分、雇佣兵与游荡者 15 分、其他生物 5 分，带五角星的精英额外 +5，累计满 100 分 +1UP（带音效，不限次数，溢出分数结转），重新获得 1UP 时开始冷却，冷却结束（HUD 锁图标消失）才能再次复活；不开启时保持原样（每关一次复活）。死亡时在 YOU DIED 界面获得一次回溯机会，回到约 60 秒前的自己（位置、朝向、血量还原，世界/物品不回滚）。结算界面时间轴提供 60/50/40/30 秒四个节点（节点只标秒数，默认选 60 秒）；进图不足 60 秒则回到进图位置。HUD 1up 硬币提示剩余机会：可用时全亮、冷却中显示倒计时、机会用掉后显示锁与当前积分，进入关卡拿到机会时响一次「1UP」提示音。在神秘山洞、仓库区地道等独立空间内也能回溯，并可跨空间回到主地图的老位置（换地图则清空重来）。萌新做的第一款 mod（AI 开发）如遇 bug 欢迎留言。
version = 1.1.0
tags = 体验优化,视觉效果,玩法
